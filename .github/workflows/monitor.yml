name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v5

      - name: Continuous Server Monitor Loop
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import time
          import subprocess

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "56528"
          webhook = os.environ.get("WEBHOOK", "")
          state_file = "server_state.txt"

          # Run 12 checks spaced 20 seconds apart (4 minutes total run time)
          for cycle in range(12):
              print(f"--- Cycle {cycle + 1}/12 ---")

              apis = [
                  f"https://api.mcsrvstat.us/bedrock/2/{HOST}:{PORT}",
                  f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{PORT}"
              ]

              online = False
              for url in apis:
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0"}
                      )
                      with urllib.request.urlopen(req, timeout=8) as response:
                          data = json.load(response)
                          online = data.get("online", False)
                          if online:
                              break
                  except Exception:
                      pass

              new_state = "online" if online else "offline"

              old_state = "offline"
              if os.path.exists(state_file):
                  with open(state_file, "r") as f:
                      old_state = f.read().strip()

              # Notify Discord if state changes
              if webhook and new_state != old_state:
                  if new_state == "online":
                      msg = f"🟢 **Minecraft Server Online!**\nServer: `{HOST}:{PORT}`"
                  else:
                      msg = f"🔴 **Minecraft Server Offline!**\nServer: `{HOST}:{PORT}`"

                  try:
                      discord_req = urllib.request.Request(
                          webhook,
                          data=json.dumps({"content": msg}).encode("utf-8"),
                          headers={"Content-Type": "application/json"}
                      )
                      urllib.request.urlopen(discord_req, timeout=10)
                      print(f"Notification sent: {new_state}")
                  except Exception as e:
                      print("Discord send error:", e)

                  with open(state_file, "w") as f:
                      f.write(new_state)

                  # Save state to repo
                  subprocess.run(["git", "config", "user.name", "Aternos Monitor"], check=True)
                  subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
                  subprocess.run(["git", "add", state_file], check=True)
                  res = subprocess.run(["git", "diff", "--cached", "--quiet"])
                  if res.returncode != 0:
                      subprocess.run(["git", "commit", "-m", f"State: {new_state} [skip ci]"], check=True)
                      subprocess.run(["git", "push"], check=True)
              else:
                  print(f"Server is {new_state}. No change.")

              time.sleep(20)
          PY
          
