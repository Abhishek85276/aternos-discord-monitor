name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v5

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import time
          import subprocess

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "56528"
          webhook = os.environ.get("WEBHOOK", "").strip()

          # Primary check via mcstatus.io (best for Aternos Bedrock)
          apis = [
              f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{PORT}",
              f"https://api.mcsrvstat.us/bedrock/2/{HOST}:{PORT}"
          ]

          online = False
          for url in apis:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(req, timeout=10) as response:
                      data = json.load(response)
                      online = data.get("online", False)
                      if online:
                          print(f"Server detected ONLINE via {url}")
                          break
              except Exception as e:
                  print(f"API ping failed for {url}: {e}")

          new_state = "online" if online else "offline"
          print("Current state:", new_state)

          # Read previous state from local file
          state_file = "server_state.txt"
          old_state = "offline"
          if os.path.exists(state_file):
              with open(state_file, "r") as f:
                  old_state = f.read().strip()

          print("Previous state:", old_state)

          # Send Discord notification when state changes from offline -> online
          if webhook and new_state != old_state:
              if new_state == "online":
                  message = {
                      "content": (
                          "🟢 **Minecraft Server Online!**\n"
                          "Your Aternos server is now online! 🎮\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }
              else:
                  message = {
                      "content": (
                          "🔴 **Minecraft Server Offline!**\n"
                          "Your Aternos server has gone offline. 💤\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }

              try:
                  discord_req = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "Aternos-Discord-Monitor/1.0"
                      }
                  )
                  with urllib.request.urlopen(discord_req, timeout=10) as r:
                      print("Discord notification sent! Status:", r.status)
              except Exception as err:
                  print("Failed to send Discord message:", err)

          # Save current state
          with open(state_file, "w") as f:
              f.write(new_state)

          # Commit and push updated state back to GitHub
          subprocess.run(["git", "config", "user.name", "Aternos Monitor"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", state_file], check=True)
          
          result = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if result.returncode != 0:
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "commit", "-m", "Update server status [skip ci]"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("Server state updated in repo.")
          else:
              print("Server state unchanged.")
          PY
          
