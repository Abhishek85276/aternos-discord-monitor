name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: aternos-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Get repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import subprocess
          import time
          import random

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "11406"

          webhook = os.environ.get("WEBHOOK", "").strip()

          def parse_motd_text(data):
              motd = data.get("motd", "")
              if isinstance(motd, dict):
                  clean = motd.get("clean", "")
                  if isinstance(clean, list):
                      return " ".join(str(x) for x in clean)
                  return str(clean)
              if isinstance(motd, list):
                  return " ".join(str(x) for x in motd)
              return str(motd)

          def check_single_api(url):
              for attempt in range(2):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": f"AternosMonitorClient/{random.randint(10000, 99999)}"}
                      )
                      with urllib.request.urlopen(req, timeout=6) as resp:
                          data = json.load(resp)

                      if data.get("online") is not True:
                          return False

                      motd_text = parse_motd_text(data).lower().strip()

                      if "offline" in motd_text:
                          return False

                      if "abhishek6661" in motd_text:
                          return True

                      return False

                  except Exception as e:
                      if attempt == 0:
                          time.sleep(2)
              return None

          def evaluate_server():
              # Run 2 evaluation rounds spaced 10 seconds apart to prevent false offline alerts
              for round_num in range(1, 3):
                  print(f"--- Evaluation Round {round_num}/2 ---")
                  cb1 = random.randint(100000, 999999)
                  cb2 = random.randint(100000, 999999)

                  mcsrvstat_url = f"https://api.mcsrvstat.us/bedrock/2/{HOST}:{PORT}?cb={cb1}"
                  mcstatus_url = f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{PORT}?cb={cb2}"

                  res1 = check_single_api(mcsrvstat_url)
                  res2 = check_single_api(mcstatus_url)

                  print(f"Round {round_num} Results: mcsrvstat={res1}, mcstatus={res2}")

                  # If either API confirms online, immediately declare ONLINE
                  if res1 is True or res2 is True:
                      return "online"

                  if round_num == 1:
                      print("Server reported offline or uncertain in Round 1. Waiting 10s to recheck...")
                      time.sleep(10)

              # If both rounds confirmed explicit offline responses across all APIs
              if res1 is False and res2 is False:
                  return "offline"

              return "unknown"

          # ---------------------------------------------------------
          # STATE TRACKING
          # ---------------------------------------------------------
          state_file = "server_state.txt"
          old_state = "offline"

          if os.path.exists(state_file):
              try:
                  with open(state_file, "r") as f:
                      saved = f.read().strip()
                      if saved in ("online", "offline"):
                          old_state = saved
              except Exception:
                  old_state = "offline"

          print("Previous State:", old_state)

          raw_result = evaluate_server()
          print("Evaluated State:", raw_result)

          # Ignore unknown API hiccups and retain old state
          if raw_result == "unknown":
              new_state = old_state
              print("API uncertainty detected. Retaining previous state:", new_state)
          else:
              new_state = raw_result

          print("Confirmed Final State:", new_state)

          # ---------------------------------------------------------
          # DISCORD NOTIFICATION
          # ---------------------------------------------------------
          if webhook and new_state != old_state:
              if new_state == "online":
                  message = {
                      "content": (
                          "🟢 **Minecraft Server Online!**\n"
                          "Your Aternos server is online! 🎮\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }
              else:
                  message = {
                      "content": (
                          "🔴 **Minecraft Server Offline!**\n"
                          "Your Aternos server has gone offline. 💤\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }

              try:
                  discord_req = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={"Content-Type": "application/json", "User-Agent": "Aternos-Discord-Monitor/1.0"}
                  )
                  with urllib.request.urlopen(discord_req, timeout=8) as response:
                      print("Discord alert delivered! Status:", response.status)
              except Exception as err:
                  print("Failed to deliver Discord notification:", err)
          else:
              print("State unchanged. No Discord alert sent.")

          # ---------------------------------------------------------
          # UPDATE STATE FILE
          # ---------------------------------------------------------
          with open(state_file, "w") as f:
              f.write(new_state)

          # ---------------------------------------------------------
          # SYNC TO GITHUB
          # ---------------------------------------------------------
          subprocess.run(["git", "config", "user.name", "Aternos Monitor"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", state_file], check=True)

          diff_result = subprocess.run(["git", "diff", "--cached", "--quiet"])

          if diff_result.returncode != 0:
              print("State changed. Syncing repository...")
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "commit", "-m", "Update server status [skip ci]"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("Updated server_state.txt successfully.")
          else:
              print("No state change to commit.")

          PY
          
