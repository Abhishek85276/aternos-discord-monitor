name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v5

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import time
          import subprocess

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "56528"
          webhook = os.environ.get("WEBHOOK", "").strip()

          def ping_server():
              apis = [
                  f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{PORT}",
                  f"https://api.mcsrvstat.us/bedrock/2/{HOST}:{PORT}"
              ]
              for url in apis:
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0"}
                      )
                      with urllib.request.urlopen(req, timeout=8) as response:
                          data = json.load(response)
                          if data.get("online") is True:
                              return True
                  except Exception as e:
                      print(f"Ping failed for {url}: {e}")
              return False

          # Step 1: Initial Ping
          online = ping_server()

          # Step 2: Spam Guard - If reported offline, wait 10s and re-check before trusting it
          if not online:
              print("First ping reported offline. Re-checking in 10 seconds to prevent false alerts...")
              time.sleep(10)
              online = ping_server()

          new_state = "online" if online else "offline"
          print("Evaluated server state:", new_state)

          # Read previous state
          state_file = "server_state.txt"
          old_state = "offline"
          if os.path.exists(state_file):
              with open(state_file, "r") as f:
                  old_state = f.read().strip()

          print("Previous server state:", old_state)

          # Send Discord notification ONLY when state genuinely changes
          if webhook and new_state != old_state:
              if new_state == "online":
                  message = {
                      "content": (
                          "🟢 **Minecraft Server Online!**\n"
                          "Your Aternos server is online! 🎮\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }
              else:
                  message = {
                      "content": (
                          "🔴 **Minecraft Server Offline!**\n"
                          "Your Aternos server has gone offline. 💤\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }

              try:
                  discord_req = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "Aternos-Discord-Monitor/1.0"
                      }
                  )
                  with urllib.request.urlopen(discord_req, timeout=10) as r:
                      print("Discord notification sent! Status:", r.status)
              except Exception as err:
                  print("Failed to send Discord message:", err)

          # Save current state
          with open(state_file, "w") as f:
              f.write(new_state)

          # Save updated state to GitHub
          subprocess.run(["git", "config", "user.name", "Aternos Monitor"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", state_file], check=True)
          
          result = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if result.returncode != 0:
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "commit", "-m", "Update server status [skip ci]"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("Server state updated in repo.")
          else:
              print("Server state unchanged.")
          PY
          
