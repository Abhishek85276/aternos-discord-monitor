name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v5

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import time
          import subprocess
          import random

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "56528"
          webhook = os.environ.get("WEBHOOK", "").strip()

          def is_valid_motd(motd_text):
              """Returns False if MOTD contains Aternos standby/offline proxy phrases."""
              motd_lower = motd_text.lower()
              if "offline" in motd_lower or "aternos" in motd_lower:
                  return False
              return True

          def check_mcsrvstat(cb):
              url = f"https://api.mcsrvstat.us/bedrock/2/{HOST}:{PORT}?cb={cb}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": f"AternosMonitor/{cb}"})
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      data = json.load(resp)
                      if data.get("online") is True:
                          motd_list = data.get("motd", {}).get("clean", [])
                          motd_text = " ".join(motd_list) if isinstance(motd_list, list) else str(motd_list)
                          if is_valid_motd(motd_text):
                              print(f"mcsrvstat.us: Genuine ONLINE MOTD detected -> '{motd_text}'")
                              return True
                          else:
                              print(f"mcsrvstat.us: Offline proxy MOTD -> '{motd_text}'")
              except Exception as e:
                  print(f"mcsrvstat.us check failed: {e}")
              return False

          def check_mcstatus(cb):
              url = f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{PORT}?cb={cb}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": f"AternosMonitor/{cb}"})
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      data = json.load(resp)
                      if data.get("online") is True:
                          motd = data.get("motd", {})
                          motd_text = str(motd.get("clean", "")) or str(motd.get("raw", ""))
                          if is_valid_motd(motd_text):
                              print(f"mcstatus.io: Genuine ONLINE MOTD detected -> '{motd_text}'")
                              return True
                          else:
                              print(f"mcstatus.io: Offline proxy MOTD -> '{motd_text}'")
              except Exception as e:
                  print(f"mcstatus.io check failed: {e}")
              return False

          def evaluate_server():
              cb = random.randint(10000, 99999)
              
              # Check both APIs: if EITHER returns online with valid MOTD, server is ONLINE
              mcsrvstat_online = check_mcsrvstat(cb)
              mcstatus_online = check_mcstatus(cb)

              if mcsrvstat_online or mcstatus_online:
                  return True
              return False

          # Step 1: Initial evaluation
          online = evaluate_server()

          # Step 2: Retry buffer if initial check reports offline
          if not online:
              print("Neither API reported online. Retrying in 5 seconds to confirm real shutdown...")
              time.sleep(5)
              online = evaluate_server()

          new_state = "online" if online else "offline"
          print("Final Evaluated State:", new_state)

          # Read state file
          state_file = "server_state.txt"
          old_state = "offline"
          if os.path.exists(state_file):
              with open(state_file, "r") as f:
                  old_state = f.read().strip()

          print("Previous State:", old_state)

          # Send Discord alert on state change
          if webhook and new_state != old_state:
              if new_state == "online":
                  message = {
                      "content": (
                          "🟢 **Minecraft Server Online!**\n"
                          "Your Aternos server is online! 🎮\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }
              else:
                  message = {
                      "content": (
                          "🔴 **Minecraft Server Offline!**\n"
                          "Your Aternos server has gone offline. 💤\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }

              try:
                  discord_req = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={"Content-Type": "application/json", "User-Agent": "Aternos-Discord-Monitor/1.0"}
                  )
                  with urllib.request.urlopen(discord_req, timeout=10) as r:
                      print("Discord alert delivered! Status:", r.status)
              except Exception as err:
                  print("Failed to deliver Discord notification:", err)

          # Write state file
          with open(state_file, "w") as f:
              f.write(new_state)

          # Sync state file to repo
          subprocess.run(["git", "config", "user.name", "Aternos Monitor"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", state_file], check=True)
          
          result = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if result.returncode != 0:
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "commit", "-m", "Update server status [skip ci]"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("Updated server_state.txt in repository.")
          else:
              print("State unchanged.")
          PY
          
