name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import subprocess

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "56528"

          webhook = os.environ["WEBHOOK"]

          # Minecraft Bedrock status API
          url = f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{PORT}"

          try:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Aternos-Discord-Monitor/1.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=15) as response:
                  data = json.load(response)

              online = data.get("online", False)

              new_state = "online" if online else "offline"

              print("Server status:", new_state)

              # Read previous state
              state_file = "server_state.txt"

              if os.path.exists(state_file):
                  with open(state_file, "r") as f:
                      old_state = f.read().strip()
              else:
                  old_state = "offline"

              print("Previous state:", old_state)
              print("Current state:", new_state)

              # Send Discord message only when server changes
              if new_state == "online" and old_state != "online":

                  message = {
                      "content":
                      "🟢 **Minecraft Server Online!**\n"
                      "Your Aternos server is now online! 🎮\n"
                      "Server: `DARK_ENERGY.aternos.me:56528`"
                  }

                  discord_request = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "Aternos-Discord-Monitor/1.0"
                      }
                  )

                  with urllib.request.urlopen(discord_request, timeout=15) as r:
                      print("Discord notification sent!")
                      print("Discord response:", r.status)

              # Save new state
              with open(state_file, "w") as f:
                  f.write(new_state)

              # Save state to GitHub
              subprocess.run(
                  ["git", "config", "user.name", "Aternos Monitor"],
                  check=True
              )

              subprocess.run(
                  ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
                  check=True
              )

              subprocess.run(
                  ["git", "add", state_file],
                  check=True
              )

              result = subprocess.run(
                  ["git", "diff", "--cached", "--quiet"]
              )

              if result.returncode != 0:
                  subprocess.run(
                      ["git", "commit", "-m", "Update server status [skip ci]"],
                      check=True
                  )

                  subprocess.run(
                      ["git", "push"],
                      check=True
                  )

                  print("Server state saved to GitHub.")

              else:
                  print("Server state has not changed.")

          except Exception as e:
              print("Check failed:", e)
              raise
          PY
