name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v5

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import time
          import subprocess
          import random

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "11406"
          webhook = os.environ.get("WEBHOOK", "").strip()

          def parse_motd_text(data):
              """Extracts clean MOTD string across all API JSON schema structures."""
              motd = data.get("motd", "")
              if isinstance(motd, dict):
                  clean = motd.get("clean", "")
                  if isinstance(clean, list):
                      return " ".join(clean)
                  return str(clean)
              elif isinstance(motd, list):
                  return " ".join(motd)
              return str(motd)

          def check_api_has_custom_motd(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": f"AternosMonitorClient/{random.randint(1000, 9999)}"})
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      data = json.load(resp)
                      if data.get("online") is True:
                          motd_text = parse_motd_text(data).lower()
                          print(f"API ({url}) returned MOTD: '{motd_text}'")
                          
                          # If MOTD contains offline/aternos proxy text, it is NOT a custom MOTD
                          if "offline" in motd_text or "aternos" in motd_text:
                              print(f"API ({url}) reports offline/standby MOTD.")
                              return False
                          
                          # Custom MOTD found!
                          print(f"API ({url}) detected a custom MOTD!")
                          return True
              except Exception as e:
                  print(f"Fetch failed for {url}: {e}")
              return False

          def evaluate_server():
              cb = random.randint(10000, 99999)
              mcsrvstat_url = f"https://api.mcsrvstat.us/bedrock/2/{HOST}:{PORT}?cb={cb}"
              mcstatus_url = f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{PORT}?cb={cb}"
              
              mcsrvstat_has_custom = check_api_has_custom_motd(mcsrvstat_url)
              mcstatus_has_custom = check_api_has_custom_motd(mcstatus_url)

              # Rule 1: If EITHER API shows custom MOTD -> Server is ONLINE
              if mcsrvstat_has_custom or mcstatus_has_custom:
                  print("At least one API has a custom MOTD. Server state = ONLINE.")
                  return True

              # Rule 2: If BOTH APIs report offline/standby MOTD (or fail) -> Server is OFFLINE
              print("Both APIs report offline/standby MOTD or failed. Server state = OFFLINE.")
              return False

          # Step 1: Initial evaluation
          online = evaluate_server()

          # Step 2: Retry buffer if initial check reports offline
          if not online:
              print("Initial evaluation reported offline. Retrying in 5 seconds to double check...")
              time.sleep(5)
              online = evaluate_server()

          new_state = "online" if online else "offline"
          print("Final Evaluated State:", new_state)

          # Read state file
          state_file = "server_state.txt"
          old_state = "offline"
          if os.path.exists(state_file):
              with open(state_file, "r") as f:
                  old_state = f.read().strip()

          print("Previous State:", old_state)

          # Send Discord alert on state change
          if webhook and new_state != old_state:
              if new_state == "online":
                  message = {
                      "content": (
                          "🟢 **Minecraft Server Online!**\n"
                          "Your Aternos server is online! 🎮\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }
              else:
                  message = {
                      "content": (
                          "🔴 **Minecraft Server Offline!**\n"
                          "Your Aternos server has gone offline. 💤\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }

              try:
                  discord_req = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={"Content-Type": "application/json", "User-Agent": "Aternos-Discord-Monitor/1.0"}
                  )
                  with urllib.request.urlopen(discord_req, timeout=10) as r:
                      print("Discord alert delivered! Status:", r.status)
              except Exception as err:
                  print("Failed to deliver Discord notification:", err)

          # Write state file
          with open(state_file, "w") as f:
              f.write(new_state)

          # Sync state file to repo
          subprocess.run(["git", "config", "user.name", "Aternos Monitor"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", state_file], check=True)
          
          result = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if result.returncode != 0:
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "commit", "-m", "Update server status [skip ci]"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("Updated server_state.txt in repository.")
          else:
              print("State unchanged.")
          PY
          
