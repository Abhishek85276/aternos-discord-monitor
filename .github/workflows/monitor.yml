name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: aternos-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v5

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import subprocess
          import time
          import random

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "11406"
          webhook = os.environ.get("WEBHOOK", "").strip()

          def parse_motd_text(data):
              motd = data.get("motd", "")
              if isinstance(motd, dict):
                  clean = motd.get("clean", "")
                  if isinstance(clean, list):
                      return " ".join(clean)
                  return str(clean)
              elif isinstance(motd, list):
                  return " ".join(motd)
              return str(motd)

          def check_single_api(url):
              try:
                  req = urllib.request.Request(
                      url, 
                      headers={"User-Agent": f"AternosMonitorClient/{random.randint(10000, 99999)}"}
                  )
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      data = json.load(resp)
                      
                      if data.get("online") is True:
                          motd_text = parse_motd_text(data).lower()
                          print(f"API ({url}) MOTD: '{motd_text}'")
                          
                          # Ignore standard Aternos standby/offline proxy messages
                          if "offline" in motd_text:
                              return False

                          # Strict verification using your specific MOTD username
                          if "abhishek6661" in motd_text:
                              return True
                              
                          print("Port active but MOTD belongs to another server on host. Ignoring.")
                          return False
              except Exception as e:
                  print(f"Fetch failed for {url}: {e}")
              return False

          def evaluate_server():
              cb = random.randint(100000, 999999)
              mcsrvstat_url = f"https://api.mcsrvstat.us/bedrock/2/{HOST}:{PORT}?cb={cb}"
              mcstatus_url = f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{PORT}?cb={cb}"
              
              if check_single_api(mcsrvstat_url) or check_single_api(mcstatus_url):
                  return True
              return False

          online = evaluate_server()
          new_state = "online" if online else "offline"
          print("Evaluated Final State:", new_state)

          # Read previous state
          state_file = "server_state.txt"
          old_state = "offline"
          if os.path.exists(state_file):
              with open(state_file, "r") as f:
                  old_state = f.read().strip()

          print("Previous State:", old_state)

          # Deliver Discord message only on state flip
          if webhook and new_state != old_state:
              if new_state == "online":
                  message = {
                      "content": (
                          "🟢 **Minecraft Server Online!**\n"
                          "Your Aternos server is online! 🎮\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }
              else:
                  message = {
                      "content": (
                          "🔴 **Minecraft Server Offline!**\n"
                          "Your Aternos server has gone offline. 💤\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }

              try:
                  discord_req = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={"Content-Type": "application/json", "User-Agent": "Aternos-Discord-Monitor/1.0"}
                  )
                  with urllib.request.urlopen(discord_req, timeout=8) as r:
                      print("Discord alert delivered! Status:", r.status)
              except Exception as err:
                  print("Failed to deliver Discord notification:", err)
          else:
              print("State unchanged. No Discord alert sent.")

          # Update state file
          with open(state_file, "w") as f:
              f.write(new_state)

          # Sync state to repository
          subprocess.run(["git", "config", "user.name", "Aternos Monitor"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", state_file], check=True)
          
          result = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if result.returncode != 0:
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "commit", "-m", "Update server status [skip ci]"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("Updated server_state.txt.")
          else:
              print("No changes to commit.")
          PY
          
