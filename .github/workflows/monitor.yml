name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v5

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import time
          import subprocess
          import random

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "56528"
          webhook = os.environ.get("WEBHOOK", "").strip()

          def ping_server():
              cb = random.randint(10000, 99999)
              # Standard mcsrvstat.us Bedrock endpoint with dynamic cache-busting parameter
              url = f"https://api.mcsrvstat.us/bedrock/2/{HOST}:{PORT}?cb={cb}"
              
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": f"AternosMonitorClient/{cb}"}
                  )
                  with urllib.request.urlopen(req, timeout=10) as response:
                      data = json.load(response)
                      
                      is_online = data.get("online") is True
                      
                      # Extract MOTD clean text from mcsrvstat.us response schema
                      motd_list = data.get("motd", {}).get("clean", [])
                      motd_text = " ".join(motd_list).lower() if isinstance(motd_list, list) else str(motd_list).lower()

                      # Catch Aternos standby proxy responses ("Offline Aternos")
                      if is_online and ("offline" in motd_text or "aternos" in motd_text):
                          print(f"mcsrvstat.us returned Aternos standby proxy ('{motd_text}'). Marking OFFLINE.")
                          is_online = False

                      if is_online:
                          print(f"Detected genuine ONLINE status via mcsrvstat.us")
                          return True
                      else:
                          print(f"mcsrvstat.us reported server OFFLINE")
              except Exception as e:
                  print(f"Ping failed for mcsrvstat.us: {e}")
              
              return False

          # Step 1: Check status
          online = ping_server()

          # Step 2: Retry check if reported offline to prevent blips
          if not online:
              print("First check reported offline. Retrying in 5 seconds...")
              time.sleep(5)
              online = ping_server()

          new_state = "online" if online else "offline"
          print("Evaluated State:", new_state)

          # Read state file
          state_file = "server_state.txt"
          old_state = "offline"
          if os.path.exists(state_file):
              with open(state_file, "r") as f:
                  old_state = f.read().strip()

          print("Previous State:", old_state)

          # Trigger Discord alert on state change
          if webhook and new_state != old_state:
              if new_state == "online":
                  message = {
                      "content": (
                          "🟢 **Minecraft Server Online!**\n"
                          "Your Aternos server is online! 🎮\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }
              else:
                  message = {
                      "content": (
                          "🔴 **Minecraft Server Offline!**\n"
                          "Your Aternos server has gone offline. 💤\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }

              try:
                  discord_req = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={"Content-Type": "application/json", "User-Agent": "Aternos-Discord-Monitor/1.0"}
                  )
                  with urllib.request.urlopen(discord_req, timeout=10) as r:
                      print("Discord alert delivered successfully! Status:", r.status)
              except Exception as err:
                  print("Failed to deliver Discord notification:", err)

          # Update local state file
          with open(state_file, "w") as f:
              f.write(new_state)

          # Sync state file to repo
          subprocess.run(["git", "config", "user.name", "Aternos Monitor"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", state_file], check=True)
          
          result = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if result.returncode != 0:
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "commit", "-m", "Update server status [skip ci]"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("Updated server_state.txt in GitHub repository.")
          else:
              print("Server state unchanged. No commit needed.")
          PY
          
