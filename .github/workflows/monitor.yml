name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Restore persistent state
        uses: actions/cache/restore@v4
        with:
          path: server_state.txt
          key: server-state-${{ github.run_id }}
          restore-keys: |
            server-state-

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "56528"
          webhook = os.environ.get("WEBHOOK", "")
          state_file = "server_state.txt"

          if not webhook:
              print("Warning: DISCORD_WEBHOOK secret is missing or empty.")

          # Fetch Minecraft Bedrock status
          url = f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{PORT}"
          try:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Aternos-Discord-Monitor/1.0",
                      "Accept": "application/json"
                  }
              )
              with urllib.request.urlopen(req, timeout=15) as response:
                  data = json.load(response)
              
              online = data.get("online", False)
              new_state = "online" if online else "offline"
              print(f"Current server status: {new_state}")

              # Read previous state
              old_state = "offline"
              if os.path.exists(state_file):
                  with open(state_file, "r") as f:
                      old_state = f.read().strip()
              print(f"Previous state: {old_state}")

              # Notify Discord on transition: offline -> online
              if new_state == "online" and old_state != "online" and webhook:
                  message = {
                      "content": (
                          "🟢 **Minecraft Server Online!**\n"
                          "Your Aternos server is now online! 🎮\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }
                  discord_req = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "Aternos-Discord-Monitor/1.0"
                      }
                  )
                  try:
                      with urllib.request.urlopen(discord_req, timeout=15) as r:
                          print("Discord notification sent! Status:", r.status)
                  except urllib.error.URLError as err:
                      print("Failed to send Discord webhook:", err)

              # Save current state locally for caching step
              with open(state_file, "w") as f:
                  f.write(new_state)

          except Exception as e:
              print("Check failed:", e)
              raise
          PY

      - name: Save persistent state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: server_state.txt
          key: server-state-${{ github.run_id }}
          
