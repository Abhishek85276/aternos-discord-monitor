name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: aternos-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Get repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import subprocess
          import time
          import random

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "11406"

          webhook = os.environ.get("WEBHOOK", "").strip()

          def parse_motd_text(data):
              motd = data.get("motd", "")
              if isinstance(motd, dict):
                  clean = motd.get("clean", "")
                  if isinstance(clean, list):
                      return " ".join(str(x) for x in clean)
                  return str(clean)
              if isinstance(motd, list):
                  return " ".join(str(x) for x in motd)
              return str(motd)

          def check_single_api(url):
              for attempt in range(2):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": f"AternosMonitorClient/{random.randint(10000, 99999)}"}
                      )
                      with urllib.request.urlopen(req, timeout=6) as resp:
                          data = json.load(resp)

                      if data.get("online") is not True:
                          return False

                      motd_text = parse_motd_text(data).lower().strip()

                      if "offline" in motd_text:
                          return False

                      if "abhishek6661" in motd_text:
                          return True

                      return False

                  except Exception as e:
                      if attempt == 0:
                          time.sleep(2)
              return None

          def evaluate_server():
              cb1 = random.randint(100000, 999999)
              cb2 = random.randint(100000, 999999)

              mcsrvstat_url = f"https://api.mcsrvstat.us/bedrock/2/{HOST}:{PORT}?cb={cb1}"
              mcstatus_url = f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{PORT}?cb={cb2}"

              result1 = check_single_api(mcsrvstat_url)
              result2 = check_single_api(mcstatus_url)

              print(f"API RESULTS: mcsrvstat={result1}, mcstatus={result2}")

              # Positive match on either API means server is explicitly ONLINE
              if result1 is True or result2 is True:
                  return "online"

              # Both APIs explicitly respond with offline/wrong MOTD
              if result1 is False and result2 is False:
                  return "offline"

              # Network timeout / API issue
              return "unknown"

          # ---------------------------------------------------------
          # STATE TRACKING WITH FAULT TOLERANCE
          # ---------------------------------------------------------
          state_file = "server_state.txt"
          fail_count_file = "fail_count.txt"

          old_state = "offline"
          if os.path.exists(state_file):
              with open(state_file, "r") as f:
                  saved_state = f.read().strip()
                  if saved_state in ("online", "offline"):
                      old_state = saved_state

          fail_count = 0
          if os.path.exists(fail_count_file):
              try:
                  with open(fail_count_file, "r") as f:
                      fail_count = int(f.read().strip())
              except ValueError:
                  fail_count = 0

          print(f"Previous State: {old_state} | Fail Count: {fail_count}")

          current_eval = evaluate_server()
          print("Raw Evaluation:", current_eval)

          new_state = old_state

          if current_eval == "online":
              fail_count = 0
              new_state = "online"
          elif current_eval == "offline":
              fail_count += 1
              print(f"Server evaluated as offline. Consecutive failure count: {fail_count}")
              # Require 2 consecutive failed checks to confirm offline state
              if old_state == "online" and fail_count >= 2:
                  new_state = "offline"
              elif old_state == "offline":
                  new_state = "offline"
          else:
              # 'unknown' API error: retain current state and don't increment failure counter
              print("API error/uncertainty. Preserving previous state.")

          print(f"Confirmed Final State: {new_state}")

          # ---------------------------------------------------------
          # DISCORD NOTIFICATION
          # ---------------------------------------------------------
          if webhook and new_state != old_state:
              if new_state == "online":
                  message = {
                      "content": (
                          "🟢 **Minecraft Server Online!**\n"
                          "Your Aternos server is online! 🎮\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }
              else:
                  message = {
                      "content": (
                          "🔴 **Minecraft Server Offline!**\n"
                          "Your Aternos server has gone offline. 💤\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }

              try:
                  discord_req = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={"Content-Type": "application/json", "User-Agent": "Aternos-Discord-Monitor/1.0"}
                  )
                  with urllib.request.urlopen(discord_req, timeout=8) as response:
                      print("Discord alert delivered! Status:", response.status)
              except Exception as err:
                  print("Failed to deliver Discord notification:", err)
          else:
              print("State unchanged. No Discord alert sent.")

          # ---------------------------------------------------------
          # UPDATE LOCAL STATE FILES
          # ---------------------------------------------------------
          with open(state_file, "w") as f:
              f.write(new_state)

          with open(fail_count_file, "w") as f:
              f.write(str(fail_count))

          # ---------------------------------------------------------
          # SYNC WITH REPOSITORY
          # ---------------------------------------------------------
          subprocess.run(["git", "config", "user.name", "Aternos Monitor"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", state_file, fail_count_file], check=True)

          diff_result = subprocess.run(["git", "diff", "--cached", "--quiet"])

          if diff_result.returncode != 0:
              print("State changed. Committing updates...")
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "commit", "-m", "Update server state [skip ci]"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("Updated repository state.")
          else:
              print("No state changes to commit.")

          PY
          
