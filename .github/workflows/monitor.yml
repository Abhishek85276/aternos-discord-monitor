name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v5

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import time
          import subprocess
          import random

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "56528"
          webhook = os.environ.get("WEBHOOK", "").strip()

          def ping_server():
              cb = random.randint(10000, 99999)
              apis = [
                  f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{PORT}?nocache={cb}",
                  f"https://api.mcsrvstat.us/bedrock/2/{HOST}:{PORT}"
              ]
              for url in apis:
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": f"AternosMonitorClient/{cb}"}
                      )
                      with urllib.request.urlopen(req, timeout=8) as response:
                          data = json.load(response)
                          
                          # Extract MOTD text across different API formats
                          motd_text = ""
                          if "motd" in data:
                              if isinstance(data["motd"], dict):
                                  motd_text = data["motd"].get("clean", "") or data["motd"].get("raw", "")
                              elif isinstance(data["motd"], list):
                                  motd_text = " ".join(data["motd"])
                              else:
                                  motd_text = str(data["motd"])

                          is_online = data.get("online") is True
                          
                          # Ignore false-positives where Aternos proxy returns "Offline Aternos"
                          if is_online and "offline" in motd_text.lower():
                              print(f"Server returned proxy standby state ('{motd_text}'). Marking OFFLINE.")
                              is_online = False

                          if is_online:
                              print(f"Detected genuine ONLINE status via {url}")
                              return True
                  except Exception as e:
                      print(f"Ping failed for {url}: {e}")
              return False

          # Run check
          online = ping_server()

          if not online:
              print("First check indicated offline. Retrying in 5 seconds...")
              time.sleep(5)
              online = ping_server()

          new_state = "online" if online else "offline"
          print("Evaluated State:", new_state)

          # Read state file
          state_file = "server_state.txt"
          old_state = "offline"
          if os.path.exists(state_file):
              with open(state_file, "r") as f:
                  old_state = f.read().strip()

          print("Previous State:", old_state)

          # Send Discord alert on state change
          if webhook and new_state != old_state:
              if new_state == "online":
                  message = {
                      "content": (
                          "🟢 **Minecraft Server Online!**\n"
                          "Your Aternos server is online! 🎮\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }
              else:
                  message = {
                      "content": (
                          "🔴 **Minecraft Server Offline!**\n"
                          "Your Aternos server has gone offline. 💤\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }

              try:
                  discord_req = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={"Content-Type": "application/json", "User-Agent": "Aternos-Discord-Monitor/1.0"}
                  )
                  with urllib.request.urlopen(discord_req, timeout=10) as r:
                      print("Discord alert delivered successfully! HTTP Status:", r.status)
              except Exception as err:
                  print("Failed to send Discord notification:", err)

          # Write new state
          with open(state_file, "w") as f:
              f.write(new_state)

          # Commit changes
          subprocess.run(["git", "config", "user.name", "Aternos Monitor"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", state_file], check=True)
          
          result = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if result.returncode != 0:
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "commit", "-m", "Update server status [skip ci]"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("State synced to repository.")
          else:
              print("State unchanged.")
          PY
          
