name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: aternos-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Get repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mcstatus

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import subprocess
          import socket
          from mcstatus import BedrockServer

          # Primary hostname
          HOST = "DARK_ENERGY.aternos.me"
          FALLBACK_PORT = 11406

          webhook = os.environ.get("WEBHOOK", "").strip()

          def ping_server():
              # Method 1: Resolve server dynamically using Aternos Bedrock Direct Query
              try:
                  print(f"Pinging Bedrock server directly at {HOST}:{FALLBACK_PORT}...")
                  server = BedrockServer.lookup(f"{HOST}:{FALLBACK_PORT}")
                  status = server.status()
                  
                  motd_clean = status.motd.raw.lower() if hasattr(status.motd, 'raw') else str(status.motd).lower()
                  print(f"Direct Ping Success! MOTD: '{motd_clean}'")

                  if "offline" in motd_clean:
                      return "offline"

                  # Check for unique identifier or active player slots
                  if "abhishek6661" in motd_clean or status.players.max > 0:
                      return "online"

              except Exception as e:
                  print(f"Direct ping failed: {e}")

              # Method 2: Public API Fallback if direct UDP fails
              try:
                  print("Attempting public API fallback...")
                  url = f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{FALLBACK_PORT}"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      data = json.load(resp)
                      
                  if data.get("online") is True:
                      return "online"
                  elif data.get("online") is False:
                      return "offline"
              except Exception as e:
                  print(f"API fallback failed: {e}")

              return "unknown"

          # ---------------------------------------------------------
          # STATE TRACKING
          # ---------------------------------------------------------
          state_file = "server_state.txt"
          old_state = "offline"

          if os.path.exists(state_file):
              try:
                  with open(state_file, "r") as f:
                      saved = f.read().strip()
                      if saved in ("online", "offline"):
                          old_state = saved
              except Exception:
                  old_state = "offline"

          print("Previous State:", old_state)

          raw_result = ping_server()
          print("Evaluated State:", raw_result)

          if raw_result == "unknown":
              new_state = old_state
              print("Uncertain state. Retaining previous state:", new_state)
          else:
              new_state = raw_result

          print("Confirmed Final State:", new_state)

          # ---------------------------------------------------------
          # DISCORD NOTIFICATION
          # ---------------------------------------------------------
          if webhook and new_state != old_state:
              if new_state == "online":
                  message = {
                      "content": (
                          "🟢 **Minecraft Server Online!**\n"
                          "Your Aternos server is online! 🎮\n"
                          f"Server: `{HOST}:{FALLBACK_PORT}`"
                      )
                  }
              else:
                  message = {
                      "content": (
                          "🔴 **Minecraft Server Offline!**\n"
                          "Your Aternos server has gone offline. 💤\n"
                          f"Server: `{HOST}:{FALLBACK_PORT}`"
                      )
                  }

              try:
                  discord_req = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={"Content-Type": "application/json"}
                  )
                  with urllib.request.urlopen(discord_req, timeout=8) as response:
                      print("Discord alert delivered! Status:", response.status)
              except Exception as err:
                  print("Failed to deliver Discord notification:", err)
          else:
              print("State unchanged. No Discord alert sent.")

          # ---------------------------------------------------------
          # UPDATE STATE FILE
          # ---------------------------------------------------------
          with open(state_file, "w") as f:
              f.write(new_state)

          # ---------------------------------------------------------
          # SYNC TO GITHUB
          # ---------------------------------------------------------
          subprocess.run(["git", "config", "user.name", "Aternos Monitor"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", state_file], check=True)

          diff_result = subprocess.run(["git", "diff", "--cached", "--quiet"])

          if diff_result.returncode != 0:
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "commit", "-m", "Update server status [skip ci]"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("Updated server_state.txt successfully.")
          else:
              print("No state change to commit.")

          PY
          
