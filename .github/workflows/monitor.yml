name: Aternos Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v5

      - name: Check server and notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import time
          import subprocess
          import random

          HOST = "DARK_ENERGY.aternos.me"
          PORT = "56528"
          webhook = os.environ.get("WEBHOOK", "").strip()

          def check_mcstatus(cb):
              url = f"https://api.mcstatus.io/v2/status/bedrock/{HOST}:{PORT}?cb={cb}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": f"AternosMonitor/{cb}"})
                  with urllib.request.urlopen(req, timeout=6) as resp:
                      data = json.load(resp)
                      if data.get("online") is True:
                          motd = data.get("motd", {})
                          raw_motd = str(motd.get("clean", "")) + str(motd.get("raw", ""))
                          if "offline" in raw_motd.lower() or "aternos" in raw_motd.lower():
                              print("mcstatus.io: Standby proxy detected.")
                              return False
                          print("mcstatus.io: Genuine ONLINE state.")
                          return True
              except Exception as e:
                  print(f"mcstatus.io failed: {e}")
              return None

          def check_mcsrvstat(cb):
              url = f"https://api.mcsrvstat.us/bedrock/2/{HOST}:{PORT}?cb={cb}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": f"AternosMonitor/{cb}"})
                  with urllib.request.urlopen(req, timeout=6) as resp:
                      data = json.load(resp)
                      if data.get("online") is True:
                          motd_list = data.get("motd", {}).get("clean", [])
                          motd_text = " ".join(motd_list).lower() if isinstance(motd_list, list) else str(motd_list).lower()
                          if "offline" in motd_text or "aternos" in motd_text:
                              print("mcsrvstat.us: Standby proxy detected.")
                              return False
                          print("mcsrvstat.us: Genuine ONLINE state.")
                          return True
              except Exception as e:
                  print(f"mcsrvstat.us failed: {e}")
              return None

          def ping_server():
              cb = random.randint(10000, 99999)
              # Priority 1: mcstatus.io
              res = check_mcstatus(cb)
              if res is not None:
                  return res
              
              # Priority 2: Fallback to mcsrvstat.us if mcstatus.io errors out
              res = check_mcsrvstat(cb)
              if res is not None:
                  return res

              return False

          # Step 1: Initial check
          online = ping_server()

          # Step 2: Retry buffer if initial check reports offline
          if not online:
              print("First check reported offline. Retrying in 5s...")
              time.sleep(5)
              online = ping_server()

          new_state = "online" if online else "offline"
          print("Evaluated State:", new_state)

          # Read state file
          state_file = "server_state.txt"
          old_state = "offline"
          if os.path.exists(state_file):
              with open(state_file, "r") as f:
                  old_state = f.read().strip()

          print("Previous State:", old_state)

          # Discord alert trigger
          if webhook and new_state != old_state:
              if new_state == "online":
                  message = {
                      "content": (
                          "🟢 **Minecraft Server Online!**\n"
                          "Your Aternos server is online! 🎮\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }
              else:
                  message = {
                      "content": (
                          "🔴 **Minecraft Server Offline!**\n"
                          "Your Aternos server has gone offline. 💤\n"
                          f"Server: `{HOST}:{PORT}`"
                      )
                  }

              try:
                  discord_req = urllib.request.Request(
                      webhook,
                      data=json.dumps(message).encode("utf-8"),
                      headers={"Content-Type": "application/json", "User-Agent": "Aternos-Discord-Monitor/1.0"}
                  )
                  with urllib.request.urlopen(discord_req, timeout=10) as r:
                      print("Discord alert delivered! Status:", r.status)
              except Exception as err:
                  print("Failed to deliver Discord notification:", err)

          # Write state file
          with open(state_file, "w") as f:
              f.write(new_state)

          # Commit changes
          subprocess.run(["git", "config", "user.name", "Aternos Monitor"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", state_file], check=True)
          
          result = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if result.returncode != 0:
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)
              subprocess.run(["git", "commit", "-m", "Update server status [skip ci]"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("Updated server_state.txt in repository.")
          else:
              print("State unchanged.")
          PY
          
